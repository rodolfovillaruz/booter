name: Release

# Push a tag like v0.2.0 to build a signed release APK and publish it as a GitHub release.
# Needs these repository secrets:
#   KEYSTORE_BASE64    the release keystore, base64-encoded (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD  the store password (also used as the key password)
#   KEY_ALIAS          the key alias

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi

      # Android (and so Obtainium) refuses an update whose versionCode isn't higher.
      - name: Check versionCode went up since the previous release
        run: |
          code() { sed -n 's/^ *versionCode = \([0-9]*\)/\1/p'; }
          current=$(code < app/build.gradle.kts)
          previous_tag=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$previous_tag" ]; then
            previous=$(git show "$previous_tag:app/build.gradle.kts" | code)
            if [ "$current" -le "$previous" ]; then
              echo "::error::versionCode $current is not higher than $previous in $previous_tag"
              exit 1
            fi
          fi

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS secrets are required"
            exit 1
          fi
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          echo "$KEYSTORE_BASE64" | base64 -d > "$dir/release.jks"
          printf '%s' "$KEYSTORE_PASSWORD" > "$dir/password"
          cat > keystore.properties <<PROPS
          storeFile=$dir/release.jks
          storePasswordFile=$dir/password
          keyAlias=$KEY_ALIAS
          PROPS

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="booter-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "$GITHUB_REF_NAME" --generate-notes
